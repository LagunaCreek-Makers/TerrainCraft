name: Release

# Push a tag such as v1.1.0 to build the CLI and desktop app for Windows, macOS and
# Linux and publish them as a GitHub release. Run it by hand, or change this file in a
# pull request, to build without publishing (the archives are kept as workflow artifacts).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p terraincraft-cli -p terraincraft-desktop
      - name: Package
        shell: bash
        run: |
          name="terraincraft-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p "dist/$name"
          for bin in terraincraft-cli terraincraft-desktop; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "dist/$name/"
          done
          cp -R assets examples README.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - name: Smoke test the CLI
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          "target/${{ matrix.target }}/release/terraincraft-cli$ext" examples/demo.csv "$RUNNER_TEMP/out" 220
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "TerrainCraft $GITHUB_REF_NAME" --generate-notes
