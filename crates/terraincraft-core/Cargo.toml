[package]
name = "terraincraft-core"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
serde_json = "1"
tiff = "0.9"
geo = "0.31"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }

earcutr = "0.4"

[features]
# HTTP download of USGS 3DEP elevation; off by default so the geometry core needs no network.
download = ["dep:reqwest"]
